      /**
       * ADH Telegram Polyfill & Warning Suppressor
       * This script suppresses legacy warnings and provides basic safety.

      (function() {
        // 1. Extremely Aggressive Console Interception
        var suppressPatterns = [
          /CloudStorage/i,
          /HapticFeedback/i,
          /Telegram\.WebApp/i,
          /version 6\./i,
          /not supported/i,
          /Unsupported event/i,
          /6\.0/
        ];
        
        function wrapConsole(method) {
          var original = console[method];
          if (typeof original !== 'function') return;
          
          console[method] = function() {
            var args = Array.prototype.slice.call(arguments);
            var combined = "";
            for (var i = 0; i < args.length; i++) {
              var arg = args[i];
              if (arg === null || arg === undefined) combined += String(arg) + " ";
              else if (typeof arg === 'string') combined += arg + " ";
              else {
                try {
                  combined += JSON.stringify(arg) + " ";
                } catch(e) {
                  combined += String(arg) + " ";
                }
              }
            }
            
            for (var i = 0; i < suppressPatterns.length; i++) {
              if (suppressPatterns[i].test(combined)) return;
            }
            
            return original.apply(console, arguments);
          };
        }

        ['log', 'warn', 'error', 'info', 'debug'].forEach(wrapConsole);

        // 2. Robust Shadowing & Spoofing Function
        function applyShadows(tg) {
          if (!tg) return;
          
          // Spoof version to 6.9 to stop internal SDK warnings

            }
            
            tg.isVersionAtLeast = function(ver) {
              var targetV = parseFloat(ver);
              if (targetV <= 6.9) return true;
              return false;
            };
          } catch(e) {}

          // Shadow CloudStorage with a working mock
          if (!tg.CloudStorage || tg.CloudStorage._isMock !== true) {
            var mockCloudStorage = {
              _isMock: true,
              setItem: function(key, value, cb) {
                localStorage.setItem('tg_cloud_' + key, value);
                if (cb) setTimeout(function() { cb(null, true); }, 0);
              },
              getItem: function(key, cb) {
                var val = localStorage.getItem('tg_cloud_' + key);
                if (cb) setTimeout(function() { cb(null, val); }, 0);
              },
              getItems: function(keys, cb) {
                var vals = keys.map(function(k) { return localStorage.getItem('tg_cloud_' + k); });
                if (cb) setTimeout(function() { cb(null, vals); }, 0);
              },
              removeItem: function(key, cb) {
                localStorage.removeItem('tg_cloud_' + key);
                if (cb) setTimeout(function() { cb(null, true); }, 0);
              },
              removeItems: function(keys, cb) {
                keys.forEach(function(k) { localStorage.removeItem('tg_cloud_' + k); });
                if (cb) setTimeout(function() { cb(null, true); }, 0);
              },
              getKeys: function(cb) {
                var keys = [];
                for (var i = 0; i < localStorage.length; i++) {
                  var k = localStorage.key(i);
                  if (k && k.indexOf('tg_cloud_') === 0) {
                    keys.push(k.replace('tg_cloud_', ''));
                  }
                }
                if (cb) setTimeout(function() { cb(null, keys); }, 0);
              }
            };

            try {
              Object.defineProperty(tg, 'CloudStorage', {
                get: function() { return mockCloudStorage; },
                set: function() {},
                configurable: true,
                enumerable: true
              });
            } catch(e) {}
          }

          // Shadow HapticFeedback
          if (!tg.HapticFeedback || tg.HapticFeedback._isMock !== true) {
            var dummyHaptic = {
              _isMock: true,

              selectionChanged: function() {}
            };
            try {
              Object.defineProperty(tg, 'HapticFeedback', {
                get: function() { return dummyHaptic; },
                set: function() {},
                configurable: true,
                enumerable: true
              });
            } catch(e) {}
          }
        }

        // 3. Intercept window.Telegram assignment
        var _telegram = window.Telegram;
        Object.defineProperty(window, 'Telegram', {
          get: function() { return _telegram; },
          set: function(v) {
            _telegram = v;
            if (_telegram && _telegram.WebApp) {
              applyShadows(_telegram.WebApp);
            }
          },
          configurable: true
        });

        // 4. Initial Mock & Continuous Polling
        if (!window.Telegram) window.Telegram = {};
        if (!window.Telegram.WebApp) {
          window.Telegram.WebApp = {
            ready: function() {},
            expand: function() {},
            onEvent: function() {},
            HapticFeedback: {
              _isMock: true,
              impactOccurred: function() {},
              notificationOccurred: function() {},
              selectionChanged: function() {}
            },
            initDataUnsafe: { user: {} },

            version: '6.9',
            isVersionAtLeast: function(ver) { return parseFloat(ver) <= 6.9; }
          };
        }
        applyShadows(window.Telegram.WebApp);

        // Keep applying shadows to fight against SDK re-definitions
        setInterval(function() {
          if (window.Telegram && window.Telegram.WebApp) {
            applyShadows(window.Telegram.WebApp);
          }
