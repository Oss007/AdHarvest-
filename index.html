<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AdHarvest (ADH)</title>
    <link rel="manifest" href="/manifest.json" />
    <script>
      /**
       * ADH Telegram Polyfill & Warning Suppressor
       * This script suppresses legacy warnings and provides basic safety.
       */
      (function() {
        // 1. Console Interception
        var suppressPatterns = [
          /CloudStorage is not supported/i,
          /HapticFeedback is not supported/i,
          /\[Telegram\.WebApp\] CloudStorage/i,
          /\[Telegram\.WebApp\] HapticFeedback/i,
          /version 6\.[0-8]/i,
          /version 6\.0/i,
          /not supported in version/i,
          /\[Telegram\.WebApp\]/i
        ];
        
        var methods = ['log', 'warn', 'error', 'info', 'debug'];
        
        methods.forEach(function(method) {
          var original = console[method];
          if (typeof original !== 'function') return;
          
          console[method] = function() {
            var args = Array.prototype.slice.call(arguments);
            var combined = "";
            try {
              combined = args.map(function(a) {
                if (typeof a === 'string') return a;
                try { return JSON.stringify(a); } catch(e) { return String(a); }
              }).join(' ');
            } catch(e) {
              combined = args.join(' ');
            }
            
            for (var i = 0; i < suppressPatterns.length; i++) {
              if (suppressPatterns[i].test(combined)) return;
            }
            
            original.apply(console, arguments);
          };
        });

        // 2. Basic Telegram Mock (if not loaded yet)
        if (!window.Telegram) {
          window.Telegram = {};
        }
        if (!window.Telegram.WebApp) {
          window.Telegram.WebApp = {
            ready: function() {},
            expand: function() {},
            onEvent: function() {},
            HapticFeedback: {
              impactOccurred: function() {},
              notificationOccurred: function() {},
              selectionChanged: function() {}
            },
            initDataUnsafe: { user: {} },
            colorScheme: 'light',
            version: '6.0'
          };
        }
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10780044' data-sdk='show_10780044'></script>
  </head>
  <body class="bg-gray-50 text-gray-900 overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
