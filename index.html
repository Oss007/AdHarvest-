<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AdHarvest (ADH)</title>
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Fix for Telegram CloudStorage warning on legacy versions (< 6.9)
      // 1. Suppress the warning message itself across all console methods
      (function() {
        var methods = ['log', 'warn', 'error', 'info'];
        methods.forEach(function(method) {
          var original = console[method];
          console[method] = function() {
            if (arguments[0] && typeof arguments[0] === 'string' && 
                (arguments[0].indexOf('CloudStorage is not supported') !== -1 || 
                 arguments[0].indexOf('[Telegram.WebApp] CloudStorage') !== -1)) {
              return;
            }
            original.apply(console, arguments);
          };
        });
      })();

      // 2. Shadow the property as soon as Telegram is available
      (function() {
        function shadowCloudStorage(tg) {
          if (!tg || !tg.WebApp) return;
          try {
            var v = tg.WebApp.version || '0';
            var p = v.split('.');
            var major = parseInt(p[0], 10) || 0;
            var minor = parseInt(p[1], 10) || 0;
            if (major < 6 || (major === 6 && minor < 9)) {
              Object.defineProperty(tg.WebApp, 'CloudStorage', {
                value: null,
                writable: false,
                configurable: true,
                enumerable: true
              });
            }
          } catch(e) {}
        }

        // Handle pre-existing Telegram object
        if (window.Telegram) {
          shadowCloudStorage(window.Telegram);
        }

        // Intercept future assignments to window.Telegram
        var _telegram = window.Telegram;
        Object.defineProperty(window, 'Telegram', {
          configurable: true,
          enumerable: true,
          get: function() { return _telegram; },
          set: function(val) {
            shadowCloudStorage(val);
            _telegram = val;
          }
        });
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10780044' data-sdk='show_10780044'></script>
  </head>
  <body class="bg-gray-50 text-gray-900 overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
